services:
  - type: web
    name: shaxsi-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python combined_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: STRING_SESSION
        sync: false
